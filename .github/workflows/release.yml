name: Release (Developer ID, notarized)

# INACTIVE UNTIL APPLE GRANTS THE DISTRIBUTION ENTITLEMENTS.
#
# A notarized build that loads on other people's Macs needs Apple to grant the
# *distribution* forms of the DriverKit entitlements (PCI transport and the SCSI
# controller family) to the signing team. The "development" entitlements this
# project builds with today cannot be used with a Developer ID signature.
# This workflow is written for the day that grant exists and HAS NOT BEEN RUN.
# It only does anything when the repository variable RELEASE_SIGNING_ENABLED is "true".
#
# Secrets it expects:
#   DEVELOPER_ID_P12_BASE64     Developer ID Application certificate + key (.p12, base64)
#   DEVELOPER_ID_P12_PASSWORD   password of that .p12
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64   App Store Connect API key
#   TEAM_ID                     Apple Developer team ID

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: vars.RELEASE_SIGNING_ENABLED == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodegen generate
          xcodebuild -project DroboDriverKit.xcodeproj -scheme DroboHost \
            -configuration Release -archivePath "$RUNNER_TEMP/DroboDriverKit.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" archive

      - name: Export with Developer ID
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/DroboDriverKit.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Notarize and staple
        run: |
          cd "$RUNNER_TEMP/export"
          ditto -c -k --keepParent DroboDriverKit.app DroboDriverKit.zip
          xcrun notarytool submit DroboDriverKit.zip --wait \
            --key "$RUNNER_TEMP/asc/AuthKey.p8" \
            --key-id "${{ secrets.ASC_KEY_ID }}" --issuer "${{ secrets.ASC_ISSUER_ID }}"
          xcrun stapler staple DroboDriverKit.app
          rm DroboDriverKit.zip
          ditto -c -k --keepParent DroboDriverKit.app "DroboDriverKit-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/export/DroboDriverKit-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes
