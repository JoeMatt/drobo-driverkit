name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i driverkit

      # The driver's firmware-shell requests, printed and compared with protocol notes 11.22.
      # Runs on the build machine only; nothing is sent to a Drobo.
      - name: Shell request bytes match the protocol notes
        run: |
          xcrun clang++ -std=gnu++17 -Wall -Werror -o "$RUNNER_TEMP/shell_request_bytes" tests/shell_request_bytes.cpp
          "$RUNNER_TEMP/shell_request_bytes"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # A compile check only. An unsigned driver extension cannot be loaded by macOS,
      # so no artifact is published from this job.
      - name: Build
        run: |
          xcodebuild -project DroboDriverKit.xcodeproj -scheme DroboHost \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
