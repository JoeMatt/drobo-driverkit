name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i driverkit

      # The driver's firmware-shell requests, printed and compared with protocol notes 11.22.
      # Runs on the build machine only; nothing is sent to a Drobo.
      - name: Shell request bytes match the protocol notes
        run: |
          xcrun clang++ -std=gnu++17 -Wall -Werror -o "$RUNNER_TEMP/shell_request_bytes" tests/shell_request_bytes.cpp
          "$RUNNER_TEMP/shell_request_bytes"

      # The same for the volume and reset requests (protocol notes 11.26) and the volume list decoder.
      - name: Volume request bytes match the protocol notes
        run: |
          xcrun clang++ -std=gnu++17 -Wall -Werror -o "$RUNNER_TEMP/volume_request_bytes" tests/volume_request_bytes.cpp
          "$RUNNER_TEMP/volume_request_bytes"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # A compile check only. An unsigned driver extension cannot be loaded by macOS,
      # so no artifact is published from this job.
      - name: Build
        run: |
          xcodebuild -project DroboDriverKit.xcodeproj -scheme DroboHost \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      # The built app must contain the privileged helper and the launchd plist that registers it.
      - name: Privileged helper is embedded
        run: |
          app=build/Build/Products/Release/DroboDriverKit.app
          test -x "$app/Contents/MacOS/DroboHelper"
          plist="$app/Contents/Library/LaunchDaemons/com.joemattiello.DroboDriverKit.helper.plist"
          plutil -lint "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Label' "$plist")" = com.joemattiello.DroboDriverKit.helper
          # The helper needs a bundle identifier inside the binary to find its own service name.
          otool -s __TEXT __info_plist "$app/Contents/MacOS/DroboHelper" | grep -q 'Contents of'

      - name: Install script preflight
        run: |
          bash -n scripts/install.sh
          scripts/install.sh --check

      - name: Distribution profile gate checks
        run: python3 -m unittest discover -s tests -p 'test_release.py'
