<rect x="236" y="460" width="264" height="92" rx="30" fill="url(#slat)"/><rect x="237.5" y="461.5" width="261" height="89" rx="28.5" fill="none" stroke="url(#slatRim)" stroke-width="3"/><rect x="270" y="501.0" width="134" height="10" rx="5" fill="#fff" fill-opacity=".16"/><circle cx="456" cy="506.0" r="13" fill="#45e6a1" filter="url(#led)"/>
<rect x="524" y="460" width="264" height="92" rx="30" fill="url(#slat)"/><rect x="525.5" y="461.5" width="261" height="89" rx="28.5" fill="none" stroke="url(#slatRim)" stroke-width="3"/><rect x="558" y="501.0" width="134" height="10" rx="5" fill="#fff" fill-opacity=".16"/><circle cx="744" cy="506.0" r="13" fill="#45e6a1" filter="url(#led)"/>
