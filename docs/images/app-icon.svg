<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f22"/><stop offset="1" stop-color="#060708"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.1" cy="0" r="0.75">
      <stop offset="0" stop-color="#45e6a1" stop-opacity=".42"/><stop offset="1" stop-color="#45e6a1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="1" cy="1" r="0.7">
      <stop offset="0" stop-color="#85bdff" stop-opacity=".30"/><stop offset="1" stop-color="#85bdff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="slatRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="led" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
    <g clip-path="url(#clip)">
      <rect x="100" y="100" width="824" height="824" fill="url(#glowA)"/>
      <rect x="100" y="100" width="824" height="824" fill="url(#glowB)"/>
    </g>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>
  <!-- tray -->
  <rect x="196" y="196" width="632" height="632" rx="104" fill="#000" fill-opacity=".34"/>
  <rect x="197.5" y="197.5" width="629" height="629" rx="102.5" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="3"/>
